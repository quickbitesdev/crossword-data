<h1>Crossword Daily Puzzle Data</h1>
<p>This repository provides daily crossword puzzle JSON data for the <a href="https://quickbitesdev.github.io/crossword-daily/">Crossword Daily</a> app.</p>
<h2>API</h2>
<ul>
<li><a href="meta/latest.json">meta/latest.json</a> - Latest date and available languages</li>
<li><a href="meta/languages.json">meta/languages.json</a> - All supported languages</li>
<li>puzzles/YYYY/MM/DD/{lang}.json - Daily puzzles</li>
</ul>
